<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Logo Icon Gradient (Teal/Cyan) -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0097a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00838f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Secondary Gradient -->
    <linearGradient id="logoGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00acc1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background (transparent) -->
  
  <!-- Logo Icon - Stylized Leaf/Wing -->
  <g transform="translate(140, 10)" filter="url(#shadow)">
    <!-- Left leaf/wing -->
    <path d="M 40 50 
             Q 20 35, 25 15 
             Q 30 5, 45 10 
             Q 55 15, 50 35 
             Q 48 45, 40 50 Z" 
          fill="url(#logoGradient)" opacity="0.9"/>
    
    <!-- Right leaf/wing (larger) -->
    <path d="M 45 45 
             Q 55 25, 70 20 
             Q 85 15, 80 35 
             Q 75 50, 60 55 
             Q 50 58, 45 45 Z" 
          fill="url(#logoGradient2)"/>
    
    <!-- Center stem/curl -->
    <path d="M 42 52 
             Q 45 60, 50 65 
             Q 55 70, 52 78 
             Q 50 85, 45 80 
             Q 40 75, 42 65 
             Q 43 58, 42 52 Z" 
          fill="url(#logoGradient)" opacity="0.85"/>
    
    <!-- Small accent leaf -->
    <path d="M 35 55 
             Q 30 50, 32 42 
             Q 34 38, 38 42 
             Q 42 48, 35 55 Z" 
          fill="#4dd0e1" opacity="0.7"/>
  </g>
  
  <!-- Text "KLINIK KITA" -->
  <text x="200" y="100" 
        font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="38" 
        font-weight="800" 
        fill="#0d1b3e" 
        text-anchor="middle"
        letter-spacing="2">KLINIK KITA</text>
</svg>
