<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Glow Filter for Dark Mode -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Teal Gradient (Brighter for Dark) -->
    <linearGradient id="darkGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097a7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Secondary Gradient (Brighter) -->
    <linearGradient id="darkGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26c6da;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="darkGradient3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#80deea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4dd0e1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00bcd4" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background (transparent for dark mode) -->
  
  <!-- Main Icon Group with Glow -->
  <g transform="translate(30, 10)" filter="url(#glow)">
    <!-- Left leaf/wing (larger, brighter) -->
    <path d="M 60 80 
             Q 35 55, 40 25 
             Q 45 10, 65 18 
             Q 80 25, 72 55 
             Q 68 70, 60 80 Z" 
          fill="url(#darkGradient1)" opacity="0.95"/>
    
    <!-- Right leaf/wing (larger, brighter) -->
    <path d="M 68 72 
             Q 82 42, 100 35 
             Q 118 28, 112 55 
             Q 105 78, 85 85 
             Q 72 90, 68 72 Z" 
          fill="url(#darkGradient2)"/>
    
    <!-- Center stem/curl (brighter) -->
    <path d="M 62 82 
             Q 68 95, 75 105 
             Q 82 115, 78 128 
             Q 74 140, 65 132 
             Q 58 125, 62 108 
             Q 64 95, 62 82 Z" 
          fill="url(#darkGradient1)" opacity="0.9"/>
    
    <!-- Small accent leaf (bright cyan) -->
    <path d="M 52 88 
             Q 45 80, 48 68 
             Q 52 62, 58 68 
             Q 65 78, 52 88 Z" 
          fill="url(#darkGradient3)" opacity="0.8"/>
    
    <!-- Decorative dots (glowing) -->
    <circle cx="48" cy="50" r="3" fill="#80deea" opacity="0.6"/>
    <circle cx="95" cy="45" r="2.5" fill="#4dd0e1" opacity="0.5"/>
    <circle cx="70" cy="115" r="2" fill="#80deea" opacity="0.4"/>
  </g>
  
  <!-- Text "KLINIK KITA" with glow -->
  <text x="100" y="175" 
        font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="28" 
        font-weight="800" 
        fill="#e0f7fa" 
        text-anchor="middle"
        letter-spacing="3"
        filter="url(#shadow)">KLINIK KITA</text>
  
  <!-- Subtle text shadow layer -->
  <text x="100" y="175" 
        font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="28" 
        font-weight="800" 
        fill="#4dd0e1" 
        text-anchor="middle"
        letter-spacing="3"
        opacity="0.3"
        dx="0.5"
        dy="0.5">KLINIK KITA</text>
</svg>
